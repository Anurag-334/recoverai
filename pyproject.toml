[project]
name = "recoverai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "edge-tts>=7.2.7",
    "jinja2>=3.1.4",
    "joblib>=1.5.3",
    "langchain-core>=0.3.0",
    "langgraph>=1.2.11",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "langchain-groq>=0.2.0",
    "scikit-learn>=1.7.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "xgboost>=3.2.0",
    "razorpay>=2.0.1",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]